<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>P_Motor DIAG WiFi Guardian</title>
    <meta name="description" content="سامانه هوشمند پایش و محافظت اتصال دیاگ خودرو - آرمین صنعت ثمین" />
    <meta property="og:title" content="P_Motor DIAG WiFi Guardian" />
    <meta property="og:description" content="سامانه هوشمند پایش و محافظت اتصال دیاگ خودرو - آرمین صنعت ثمین" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#00D9FF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="P_Motor DIAG" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/wifipaish/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/wifipaish/pwa-192x192.png" />
    <link rel="icon" type="image/svg+xml" href="/wifipaish/icon.svg" />
    <link rel="apple-touch-icon" href="/wifipaish/apple-touch-icon.png" />

    <!-- فونت‌ها از jsDelivr -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5.0.0/index.css"
    />

    <!-- ⚠️ فونت Material Symbols — این را در بالای style اصلی نگه دار -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/material-symbols@0.14.0/outlined.css"
    />

    <!-- ⚠️⚠️ خیلی مهم: CSS اصلی بیلد شده — این باید قبل از <style> زیر باشد -->
    <link rel="stylesheet" crossorigin href="/wifipaish/assets/index-BpV5eF3M.css" />

    <!-- ⚠️⚠️⚠️ خیلی مهم‌تر: این استایل باید بعد از CSS اصلی باشد تا Tailwind را override کند -->
    <style>
      /* با !important روی همه پراپرتی‌های حیاتی، از override شدن جلوگیری می‌کنیم */
      span.material-symbols-outlined,
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined', 'Material Icons', sans-serif !important;
        font-weight: normal !important;
        font-style: normal !important;
        font-size: inherit;
        line-height: 1 !important;
        letter-spacing: normal !important;
        text-transform: none !important;
        display: inline-block !important;
        white-space: nowrap !important;
        word-wrap: normal !important;
        direction: ltr !important;
        /* ⭐ این دو خط کلید حل مشکل هستند */
        -webkit-font-feature-settings: 'liga' 1 !important;
        font-feature-settings: 'liga' 1 !important;
        -webkit-font-variant-ligatures: normal !important;
        font-variant-ligatures: normal !important;
        -webkit-font-smoothing: antialiased !important;
        -moz-osx-font-smoothing: grayscale !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- ماژول اصلی بیلد — همیشه بعد از style -->
    <script type="module" crossorigin src="/wifipaish/assets/index-DM0k0FL-.js"></script>

    <script>
      // ثبت Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/wifipaish/sw.js', { scope: '/wifipaish/' })
            .then(function (reg) {
              console.log('[wifipaish] SW registered ✓', reg.scope);
            })
            .catch(function (err) {
              console.warn('[wifipaish] SW registration failed:', err);
            });
        });
      }

      window.addEventListener('beforeinstallprompt', function () {
        console.log('[wifipaish] Install prompt available ✓');
      });
      window.addEventListener('appinstalled', function () {
        console.log('[wifipaish] App installed ✓');
      });
    </script>
  </body>
</html>
