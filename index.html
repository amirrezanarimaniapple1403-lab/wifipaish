<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>P_Motor DIAG WiFi Guardian</title>
    <meta name="description" content="سامانه هوشمند پایش و محافظت اتصال دیاگ خودرو - آرمین صنعت ثمین" />
    <meta property="og:title" content="P_Motor DIAG WiFi Guardian" />
    <meta property="og:description" content="سامانه هوشمند پایش و محافظت اتصال دیاگ خودرو - آرمین صنعت ثمین" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#00D9FF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="P_Motor DIAG" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/wifipaish/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/wifipaish/pwa-192x192.png" />
    <link rel="icon" type="image/svg+xml" href="/wifipaish/icon.svg" />
    <link rel="apple-touch-icon" href="/wifipaish/apple-touch-icon.png" />

    <!-- فونت Vazirmatn محلی (برای اطمینان) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5.0.0/index.css"
    />

    <!-- ⭐⭐⭐ CSS اصلی بیلد — اولین CSS در head -->
    <link rel="stylesheet" crossorigin href="/wifipaish/assets/index-BpV5eF3M.css" />

    <!-- ⭐⭐⭐ استایل نهایی — آخرین چیز در head و با بالاترین specificity -->
    <style>
      /* ۱. تعریف @font-face از فایل محلی ریپو */
      @font-face {
        font-family: 'Material Symbols Outlined';
        font-style: normal;
        font-weight: 100 700;
        font-display: block;
        src: url('/wifipaish/MaterialSymbolsOutlined.woff2') format('woff2');
      }

      /* ۲. ⚠️ حیاتی‌ترین خط: روی <html> باید font-feature-settings فعال شود */
      /* چون Tailwind روی html می‌گذارد font-feature-settings: normal */
      /* و این باعث می‌شود ligatures آیکون‌ها خاموش شوند */
      html,
      html * {
        -webkit-font-feature-settings: 'liga' 1, 'clig' 1, 'calt' 1 !important;
        font-feature-settings: 'liga' 1, 'clig' 1, 'calt' 1 !important;
      }

      /* ۳. استایل اختصاصی کلاس آیکون با بالاترین specificity ممکن */
      html body span.material-symbols-outlined,
      html body .material-symbols-outlined,
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined' !important;
        font-weight: normal !important;
        font-style: normal !important;
        font-size: 24px !important;
        line-height: 1 !important;
        letter-spacing: normal !important;
        text-transform: none !important;
        display: inline-block !important;
        white-space: nowrap !important;
        word-wrap: normal !important;
        direction: ltr !important;
        -webkit-font-feature-settings: 'liga' 1, 'clig' 1, 'calt' 1 !important;
        font-feature-settings: 'liga' 1, 'clig' 1, 'calt' 1 !important;
        -webkit-font-variant-ligatures: contextual common-ligatures !important;
        font-variant-ligatures: contextual common-ligatures !important;
        -webkit-font-smoothing: antialiased !important;
        -moz-osx-font-smoothing: grayscale !important;
        text-rendering: optimizeLegibility !important;
      }

      /* ۴. محافظت اضافی: هر عنصر با کلمه‌های آیکون */
      html body [class*='material-symbols'] {
        font-family: 'Material Symbols Outlined' !important;
        font-feature-settings: 'liga' 1, 'clig' 1, 'calt' 1 !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- ⭐ ماژول اصلی بیلد — آخرین چیز در body -->
    <script type="module" crossorigin src="/wifipaish/assets/index-DM0k0FL-.js"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/wifipaish/sw.js', { scope: '/wifipaish/' })
            .then(function (reg) {
              console.log('[wifipaish] SW registered ✓', reg.scope);
            })
            .catch(function (err) {
              console.warn('[wifipaish] SW registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
