    <script>
      // ثبت Service Worker اختصاصی برای /wifipaish/

        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/wifipaish/sw.js', { scope: '/wifipaish/' })
            .then(function (reg) {
              console.log('[wifipaish] SW registered ✓', reg.scope);

            });
        });

      });
      window.addEventListener('appinstalled', function () {
        console.log('[wifipaish] App installed ✓');
      });
