<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <meta name="description" content="سامانه هوشمند پایش و محافظت اتصال دیاگ خودرو - آرمین صنعت ثمین" />
    <meta property="og:title" content="P_Motor DIAG WiFi Guardian" />
    <meta property="og:description" content="سامانه هوشمند پایش و محافظت اتصال دیاگ خودرو - آرمین صنعت ثمین" />
    <meta property="og:type" content="website" />

    <meta name="theme-color" content="#00D9FF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="P_Motor DIAG" />

    <!-- ✅ PWA Manifest -->
    <link rel="manifest" href="/wifipaish/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/wifipaish/pwa-192x192.png" />
    <link rel="icon" type="image/svg+xml" href="/wifipaish/icon.svg" />
    <link rel="apple-touch-icon" href="/wifipaish/apple-touch-icon.png" />

    <!-- ✅ فونت Vazirmatn و Space Grotesk از jsDelivr (کار می‌کند در ایران) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5.0.0/index.css"
    />

    <!-- ✅ Material Symbols از jsDelivr (جایگزین Google Fonts برای ایران) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/material-symbols@0.14.0/outlined.css"
    />

    <!-- ✅ CSS کمکی: تعریف کلاس material-symbols-outlined به صورت صریح -->
    <style>
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined', 'Material Icons', sans-serif;
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-feature-settings: 'liga';
        -webkit-font-smoothing: antialiased;
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        font-feature-settings: 'liga';
      }

      /* فالبک در صورت عدم بارگذاری فونت: آیکون‌ها را با emoji نشان بده */
      @supports not (font-variation-settings: normal) {
        .material-symbols-outlined {
          font-family: 'Material Symbols Outlined', 'Material Icons', sans-serif;
        }
      }
    </style>

    <!-- ✅ فایل‌های بیلد با مسیر مطلق -->
    <script type="module" crossorigin src="/wifipaish/assets/index-DM0k0FL-.js"></script>
    <link rel="stylesheet" crossorigin href="/wifipaish/assets/index-BpV5eF3M.css" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // ثبت Service Worker اختصاصی برای /wifipaish/
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/wifipaish/sw.js', { scope: '/wifipaish/' })
            .then(function (reg) {
              console.log('[wifipaish] SW registered ✓', reg.scope);
            })
            .catch(function (err) {
              console.warn('[wifipaish] SW registration failed:', err);
            });
        });
      }

      // لاگ دیباگ برای نصب PWA
      window.addEventListener('beforeinstallprompt', function () {
        console.log('[wifipaish] Install prompt available ✓');
      });
      window.addEventListener('appinstalled', function () {
        console.log('[wifipaish] App installed ✓');
      });
    </script>
  </body>
</html>
